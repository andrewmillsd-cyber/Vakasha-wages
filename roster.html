@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;min-height:100dvh;background:#f8fafc;font-family:'Inter',system-ui,sans-serif;color:#334155;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
input,select,button{font-family:inherit;}
.app{max-width:1200px;margin:0 auto;padding:0;}

/* Header */
.r-header{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.r-logo{display:flex;align-items:center;gap:10px;}
.r-logo img{height:32px;width:32px;border-radius:8px;object-fit:cover;}
.r-logo-title{font-size:16px;font-weight:800;color:#0f172a;}
.r-logo-sub{font-size:11px;color:#94a3b8;font-weight:500;}
.r-home-btn{padding:7px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:600;color:#64748b;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}

/* Main layout */
.r-body{padding:16px 20px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600;color:#334155;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:#f8fafc;}
.btn-primary{background:#0ea5e9;color:#fff;border-color:#0ea5e9;}
.btn-primary:hover{background:#0284c7;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-dark{background:#1e293b;color:#fff;border-color:#1e293b;}

/* Department tabs */
.dept-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;}
.dept-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0;background:#fff;color:#64748b;transition:all 0.15s;}
.dept-tab.active{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 15%,#fff);color:var(--dc);}
.dept-tab.all-active{border-color:#0ea5e9;background:#e0f2fe;color:#0284c7;}

/* Grid */
.grid-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.grid-scroll{overflow-x:auto;}
table.roster{width:100%;border-collapse:collapse;min-width:600px;}
table.roster th{padding:10px 8px;text-align:center;font-size:10px;font-weight:700;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;}
table.roster th.emp-col{text-align:left;padding:10px 14px;position:sticky;left:0;z-index:5;min-width:160px;background:#1e293b;color:#fff;}
table.roster th.today{background:var(--dept-color,#0ea5e9);color:#fff;}
table.roster th.understaffed{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
table.roster td{padding:6px 4px;text-align:center;border:1px solid #f1f5f9;cursor:pointer;transition:background 0.1s;min-width:88px;}
table.roster td.emp-name{text-align:left;padding:8px 14px;position:sticky;left:0;z-index:4;border-right:2px solid #e2e8f0;white-space:nowrap;font-size:13px;font-weight:600;color:#0f172a;background:inherit;}
table.roster td.on{background:#dcfce7;}
table.roster td.off{background:#fee2e2;}
table.roster td.summary{background:#f8fafc;cursor:default;font-size:10px;padding:5px 4px;}
table.roster td.summary-warn{background:#fff1f2;border-color:#fca5a5;cursor:default;font-size:10px;padding:5px 4px;}
table.roster tr:nth-child(even) td{background-color:rgba(248,250,252,0.7);}
table.roster tr:nth-child(even) td.on{background:#dcfce7;}
table.roster tr:nth-child(even) td.off{background:#fee2e2;}

/* Warning */
.warn-box{background:#fee2e2;border:2px solid #fca5a5;border-radius:10px;padding:12px 16px;margin-top:12px;font-size:13px;color:#991b1b;display:flex;align-items:flex-start;gap:8px;}
.unassigned-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;margin-top:8px;font-size:12px;color:#92400e;}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;padding:12px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;}
.min-staff{display:flex;align-items:center;gap:8px;}
.min-staff label{font-size:12px;font-weight:700;color:#0f172a;}
.min-num{min-width:28px;text-align:center;font-size:16px;font-weight:800;}
.min-btn{width:28px;height:28px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.chip{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.on-chip{background:#dcfce7;color:#166534;}
.off-chip{background:#fee2e2;color:#991b1b;}
.blank-chip{background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0;}

/* Mobile */
@media(max-width:767px){
  .r-body{padding:10px 12px;}
  .r-header{padding:10px 14px;}
  table.roster th,table.roster td{min-width:52px;padding:5px 3px;font-size:11px;}
  table.roster td.emp-name{font-size:11px;padding:6px 10px;min-width:90px;}
  table.roster th.emp-col{min-width:90px;padding:8px 10px;}
  .dept-tab{padding:6px 12px;font-size:11px;}
}
</style>

/* ── DATA ── */
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CY=new Date().getFullYear();
var SK_WAGES='vakasha_payroll_'+CY;
var SK_ROSTER='vakasha_roster_'+CY;
var DEPARTMENTS=['Kitchen','Grounds','Waiters','Bar Staff','Cleaners','Builders','Reception','Managers','Other Staff'];
var DEPT_COLORS={'Kitchen':'#f97316','Grounds':'#22c55e','Waiters':'#3b82f6','Bar Staff':'#a855f7','Cleaners':'#06b6d4','Builders':'#f59e0b','Reception':'#ec4899','Managers':'#6366f1','Other Staff':'#14b8a6','':'#94a3b8'};
var SHIFTS=['ON','OFF'];
var SHIFT_COLORS={ON:'#dcfce7',OFF:'#fee2e2','':''};
var SHIFT_TEXT={ON:'#166534',OFF:'#991b1b','':''};

/* Load employees from wages app storage */
function loadEmps(){
  try{
    var r=localStorage.getItem(SK_WAGES);
    if(r){var d=JSON.parse(r);return(d.emps||[]).filter(function(e){return e.active;});}
  }catch(e){}
  return[];
}
/* Load/save roster separately */
function loadRoster(){try{var r=localStorage.getItem(SK_ROSTER);if(r)return JSON.parse(r);}catch(e){}return{roster:{},rosterMinStaff:{}}; }
function saveRoster(){try{localStorage.setItem(SK_ROSTER,JSON.stringify({roster:G.roster,rosterMinStaff:G.rosterMinStaff}));}catch(e){}}

/* Also sync to wages storage */
function syncToWages(){
  try{
    var r=localStorage.getItem(SK_WAGES);
    if(r){
      var d=JSON.parse(r);
      d.roster=G.roster;d.rosterMinStaff=G.rosterMinStaff;
      localStorage.setItem(SK_WAGES,JSON.stringify(d));
    }
  }catch(e){}
}

var rData=loadRoster();
var G={
  emps:loadEmps(),
  roster:rData.roster||{},
  rosterMinStaff:rData.rosterMinStaff||{},
  rosterWeekStart:null,
  rosterDept:'ALL'
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nowTs(){return new Date().toISOString().slice(0,16).replace('T',' ');}

/* ── ROSTER HELPERS ── */
function rosterKey(dept,dateStr){return(dept||'_')+'|'+dateStr;}
function getShift(dept,empId,dateStr){
  var k=rosterKey(dept,dateStr);
  return G.roster&&G.roster[k]&&G.roster[k][empId]?G.roster[k][empId]:'';
}
function setShift(dept,empId,dateStr,shift){
  if(!G.roster)G.roster={};
  var k=rosterKey(dept,dateStr);
  if(!G.roster[k])G.roster[k]={};
  if(shift)G.roster[k][empId]=shift;else delete G.roster[k][empId];
  saveRoster();syncToWages();render();
}
function cycleShift(dept,empId,dateStr){
  var cur=getShift(dept,empId,dateStr);
  var next=cur==='ON'?'OFF':cur==='OFF'?'':'ON';
  setShift(dept,empId,dateStr,next);
}
function getWeekDates(startDate){
  var dates=[];for(var i=0;i<7;i++){var d=new Date(startDate);d.setDate(d.getDate()+i);dates.push(d);}return dates;
}
function formatDate(d){
  return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
}
function getMonday(d){
  var day=d.getDay();var diff=d.getDate()-(day===0?6:day-1);var mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);return mon;
}
function getMinStaff(dept){return G.rosterMinStaff&&G.rosterMinStaff[dept||'']?G.rosterMinStaff[dept||'']:0;}
function setMinStaff(dept,n){if(!G.rosterMinStaff)G.rosterMinStaff={};G.rosterMinStaff[dept||'']=Math.max(0,parseInt(n)||0);saveRoster();syncToWages();render();}
function countWorking(dept,dateStr,emps){var c=0;emps.forEach(function(emp){var s=getShift(dept,emp.id,dateStr);if(s==='ON')c++;});return c;}

function printRoster(dept){
  var aE=dept&&dept!=='ALL'?G.emps.filter(function(e){return e.dept===dept;}):G.emps;
  var LOGO=window.LOGO_DATA||'';
  var startDate=G.rosterWeekStart||getMonday(new Date());
  var dates=getWeekDates(startDate);
  var dc=DEPT_COLORS[dept]||'#0ea5e9';
  var MON_N=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY_N=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var minReqP=getMinStaff(dept==='ALL'?'':dept);
  var startStr=dates[0].getDate()+' '+MON_N[dates[0].getMonth()]+' '+dates[0].getFullYear();
  var endStr=dates[6].getDate()+' '+MON_N[dates[6].getMonth()]+' '+dates[6].getFullYear();
  var headerCells=dates.map(function(d){
    var ds=formatDate(d);
    var w=countWorking(dept==='ALL'?'':dept,ds,aE);
    var below=minReqP>0&&w<minReqP;
    return '<th style="padding:10px 6px;text-align:center;min-width:80px;background:'+(below?'#fee2e2':'#f8fafc')+';border:1px solid '+(below?'#fca5a5':'#e2e8f0')+';font-size:11px;color:'+(below?'#dc2626':'#64748b')+';font-weight:700;">'
      +'<div>'+DAY_N[d.getDay()]+'</div>'
      +'<div style="font-size:14px;font-weight:800;color:'+(below?'#dc2626':'#0f172a')+';">'+d.getDate()+' '+MON_N[d.getMonth()]+'</div>'
      +(below?'<div style="font-size:9px;color:#dc2626;font-weight:700;">&#9888; '+w+'/'+minReqP+'</div>':'')
      +'</th>';
  }).join('');
  var rows=aE.map(function(emp){
    var cells=dates.map(function(d){
      var shift=getShift(dept==='ALL'?'':dept,emp.id,formatDate(d));
      return '<td style="padding:8px;text-align:center;background:'+(shift==='ON'?'#dcfce7':shift==='OFF'?'#fee2e2':'#fff')+';border:1px solid #e2e8f0;">'
        +'<span style="font-weight:700;font-size:12px;color:'+(shift==='ON'?'#166534':shift==='OFF'?'#991b1b':'#d1d5db')+'">'+(shift||'—')+'</span></td>';
    }).join('');
    return '<tr><td style="padding:8px 12px;font-weight:600;border:1px solid #e2e8f0;">'+esc(emp.name)+(emp.dept?'<span style="font-size:10px;color:'+DEPT_COLORS[emp.dept||'']||'#94a3b8'+';margin-left:6px;">'+esc(emp.dept)+'</span>':'')+'</td>'+cells+'</tr>';
  }).join('');
  var summary=dates.map(function(d){
    var ds=formatDate(d);var on=countWorking(dept==='ALL'?'':dept,ds,aE);
    var off=0;aE.forEach(function(emp){if(getShift(dept==='ALL'?'':dept,emp.id,ds)==='OFF')off++;});
    var below=minReqP>0&&on<minReqP;
    return '<td style="padding:6px 8px;text-align:center;border:2px solid '+(below?'#fca5a5':'#e2e8f0')+';background:'+(below?'#fff1f2':'#f8fafc')+';font-size:11px;">'
      +(below?'<div style="color:#dc2626;font-weight:800;">&#9888; '+on+'/'+minReqP+'</div>':'')
      +(on?'<span style="color:#166534;font-weight:700;">'+on+' ON</span> ':'')
      +(off?'<span style="color:#991b1b;">'+off+' OFF</span>':'')+'</td>';
  }).join('');
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><title>Vakasha Roster'+(dept&&dept!=='ALL'?' — '+dept:'')+' '+startStr+'</title>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:system-ui,sans-serif;padding:24px;color:#1e293b;}table{width:100%;border-collapse:collapse;}@media print{.no-print{display:none;}}</style>'
    +'</head><body>'
    +(LOGO?'<img src="'+LOGO+'" style="height:36px;margin-bottom:14px;display:block;"/>':'')
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><div style="width:14px;height:14px;border-radius:50%;background:'+dc+';"></div>'
    +'<div><div style="font-size:18px;font-weight:800;">'+(dept&&dept!=='ALL'?dept:'All Departments')+' Roster</div>'
    +'<div style="font-size:12px;color:#64748b;">Week: '+startStr+' – '+endStr+' | '+aE.length+' staff'+(minReqP>0?' | Min required: '+minReqP:'')+'</div></div></div>'
    +'<table><thead><tr><th style="padding:10px 12px;text-align:left;background:'+dc+';color:#fff;border:1px solid #e2e8f0;min-width:140px;">Employee</th>'+headerCells+'</tr></thead>'
    +'<tbody>'+rows+'<tr style="border-top:2px solid #e2e8f0;"><td style="padding:6px 12px;font-weight:700;border:1px solid #e2e8f0;background:#f8fafc;font-size:11px;">Daily totals</td>'+summary+'</tr></tbody></table>'
    +'<div style="margin-top:16px;font-size:10px;color:#94a3b8;display:flex;gap:16px;"><span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-weight:700;">ON = Working</span><span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:4px;font-weight:700;">OFF = Not working</span><span style="color:#94a3b8;">Blank = unassigned</span></div>'
    +'<p style="margin-top:12px;font-size:10px;color:#94a3b8;">Printed '+nowTs()+' — Vakasha Lodge</p>'
    +'<div class="no-print" style="margin-top:16px;"><button onclick="window.print()" style="padding:8px 20px;background:#1e293b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;">Print</button></div>'
    +'</body></html>');
  w.document.close();
}

/* ── RENDER ── */
function render(){
  if(!G.rosterWeekStart)G.rosterWeekStart=getMonday(new Date());
  var root=document.getElementById('root');
  if(!root)return;

  G.emps=loadEmps();// refresh from wages storage each render
  var aE=G.emps;
  var rDates=getWeekDates(G.rosterWeekStart);
  var rEnd=new Date(G.rosterWeekStart);rEnd.setDate(rEnd.getDate()+6);
  var MON_NM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY_AB=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  var startL=rDates[0].getDate()+' '+MON_NM[rDates[0].getMonth()]+' '+rDates[0].getFullYear();
  var endL=rDates[6].getDate()+' '+MON_NM[rDates[6].getMonth()];

  var usedDepts=DEPARTMENTS.filter(function(d){return aE.some(function(e){return e.dept===d;});});
  if(!G.rosterDept)G.rosterDept='ALL';
  var activeDept=G.rosterDept==='ALL'?'':G.rosterDept;
  var rDeptEmps=activeDept!==''?aE.filter(function(e){return e.dept===activeDept;}):aE;
  var rDeptColor=DEPT_COLORS[activeDept]||'#0ea5e9';
  var minReq=getMinStaff(activeDept);

  var h='';

  /* Week nav */
  h+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;">'
    +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
    +'<button class="btn btn-sm" onclick="(function(){var d=new Date(G.rosterWeekStart);d.setDate(d.getDate()-7);G.rosterWeekStart=d;render();})()">&#8592; Prev</button>'
    +'<span style="font-size:14px;font-weight:700;color:#0f172a;">'+startL+' – '+endL+'</span>'
    +'<button class="btn btn-sm" onclick="(function(){var d=new Date(G.rosterWeekStart);d.setDate(d.getDate()+7);G.rosterWeekStart=d;render();})()">Next &#8594;</button>'
    +'<button class="btn btn-sm" style="background:#f1f5f9;" onclick="G.rosterWeekStart=getMonday(new Date());render()">Today</button>'
    +'</div>'
    +'</div>';

  /* Dept tabs */
  h+='<div class="dept-tabs">'
    +'<div class="dept-tab'+(G.rosterDept==='ALL'?' all-active':'')+'" onclick="G.rosterDept=\'ALL\';render()">All Depts</div>';
  usedDepts.forEach(function(dept){
    var dc2=DEPT_COLORS[dept]||'#94a3b8';
    var isAct=G.rosterDept!=='ALL'&&G.rosterDept===dept;
    h+='<div class="dept-tab'+(isAct?' active':'')+'" style="--dc:'+dc2+'" onclick="G.rosterDept=\''+dept+'\';render()">'+esc(dept)+'</div>';
  });
  h+='</div>';

  /* Legend + toolbar */
  h+='<div class="toolbar">'
    +'<div class="legend">'
    +'<span style="font-size:12px;font-weight:700;color:#64748b;">Legend:</span>'
    +'<span class="chip on-chip">ON</span>'
    +'<span class="chip off-chip">OFF</span>'
    +'<span class="chip blank-chip">blank = unassigned</span>'
    +'<span style="font-size:11px;color:#94a3b8;">— click any cell to toggle</span>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'
    +'<div class="min-staff">'
    +'<label>Min staff'+(activeDept?' ('+esc(activeDept)+')':'')+': </label>'
    +'<button class="min-btn" onclick="setMinStaff(\''+activeDept+'\',getMinStaff(\''+activeDept+'\') -1)">−</button>'
    +'<span class="min-num" style="color:'+(minReq>0?'#dc2626':'#94a3b8')+'">'+minReq+'</span>'
    +'<button class="min-btn" onclick="setMinStaff(\''+activeDept+'\',getMinStaff(\''+activeDept+'\') +1)">+</button>'
    +'</div>'
    +'<button class="btn btn-dark btn-sm" onclick="printRoster(\''+G.rosterDept+'\')">'
    +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
    +'Print '+(G.rosterDept==='ALL'?'All':esc(G.rosterDept))+'</button>'
    +'</div></div>';

  /* Grid */
  if(!rDeptEmps.length){
    h+='<div class="grid-wrap" style="padding:40px;text-align:center;color:#94a3b8;">'
      +(aE.length===0
        ?'<div style="font-size:32px;margin-bottom:12px;">👥</div><div style="font-size:14px;font-weight:600;color:#64748b;">No employees found</div><div style="font-size:12px;margin-top:6px;">Add employees in the <a href=\"wages.html\" style=\"color:#6366f1;\">Wages app</a> first.</div>'
        :'<div style="font-size:32px;margin-bottom:12px;">🏢</div><div style="font-size:14px;font-weight:600;color:#64748b;">No employees in this department</div>')
      +'</div>';
  } else {
    h+='<div class="grid-wrap"><div class="grid-scroll">'
      +'<table class="roster" style="--dept-color:'+rDeptColor+'"><thead><tr>'
      +'<th class="emp-col">Employee</th>';
    rDates.forEach(function(d){
      var ds=formatDate(d);
      var isToday=ds===formatDate(new Date());
      var w=countWorking(activeDept,ds,rDeptEmps);
      var below=minReq>0&&w<minReq;
      h+='<th class="'+(below?'understaffed':isToday?'today':'')+'">'
        +(below?'<div style="font-size:8px;font-weight:800;">&#9888; UNDER</div>':'')
        +(isToday&&!below?'<div style="font-size:8px;font-weight:800;opacity:0.8;">TODAY</div>':'')
        +'<div style="font-weight:800;">'+DAY_AB[d.getDay()]+'</div>'
        +'<div style="font-size:13px;font-weight:800;color:'+(below?'#dc2626':isToday?'#fff':'#0f172a')+'">'+d.getDate()+' '+MON_NM[d.getMonth()]+'</div>'
        +(below?'<div style="font-size:9px;color:#dc2626;font-weight:700;">'+w+'/'+minReq+'</div>':'')
        +'</th>';
    });
    h+='</tr></thead><tbody>';

    rDeptEmps.forEach(function(emp,ei){
      var rowStyle=ei%2===0?'background:#fff':'background:#fafafa';
      h+='<tr style="'+rowStyle+'">'
        +'<td class="emp-name"><div style="display:flex;align-items:center;gap:8px;">'
        +(emp.dept&&activeDept===''?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(DEPT_COLORS[emp.dept]||'#94a3b8')+';flex-shrink:0;"></span>':'')
        +esc(emp.name)
        +(activeDept===''&&emp.dept?'<span style="font-size:10px;color:#94a3b8;font-weight:600;">'+esc(emp.dept)+'</span>':'')
        +'</div></td>';
      rDates.forEach(function(d){
        var ds=formatDate(d);
        var shift=getShift(activeDept,emp.id,ds);
        var isToday=ds===formatDate(new Date());
        h+='<td class="'+(shift==='ON'?'on':shift==='OFF'?'off':'')+'" '
          +'onclick="cycleShift(\''+activeDept+'\','+emp.id+',\''+ds+'\');" '
          +'style="border-color:'+(isToday?rDeptColor+'88':'#f1f5f9')+';" '
          +'title="'+esc(emp.name)+' — click to toggle">'
          +'<span style="font-size:12px;font-weight:800;color:'+(shift==='ON'?'#166534':shift==='OFF'?'#991b1b':'#d1d5db')+'">'
          +(shift||'–')+'</span></td>';
      });
      h+='</tr>';
    });

    /* Summary row */
    h+='<tr><td class="emp-name" style="background:#f8fafc;font-size:11px;color:#64748b;">Daily totals'+(minReq>0?'<br><span style="font-size:9px;color:#dc2626;">Min: '+minReq+'</span>':'')+'</td>';
    rDates.forEach(function(d){
      var ds=formatDate(d);
      var on=countWorking(activeDept,ds,rDeptEmps);
      var off=0;rDeptEmps.forEach(function(emp){if(getShift(activeDept,emp.id,ds)==='OFF')off++;});
      var below=minReq>0&&on<minReq;
      h+='<td class="'+(below?'summary-warn':'summary')+'">'
        +(below?'<div style="color:#dc2626;font-weight:800;font-size:11px;">&#9888; '+on+'/'+minReq+'</div>':'')
        +(on?'<div style="color:#166534;font-weight:700;">'+on+' ON</div>':'')
        +(off?'<div style="color:#991b1b;">'+off+' OFF</div>':'')
        +(!on&&!off?'<div style="color:#d1d5db;">—</div>':'')
        +'</td>';
    });
    h+='</tr></tbody></table></div></div>';

    /* Warnings */
    var belowDays=[];
    rDates.forEach(function(d){
      var ds=formatDate(d);
      if(minReq>0){var w=countWorking(activeDept,ds,rDeptEmps);if(w<minReq)belowDays.push(DAY_AB[d.getDay()]+' '+d.getDate()+' ('+w+'/'+minReq+')');}
    });
    if(belowDays.length){
      h+='<div class="warn-box">🔴 <div><b>Understaffed: '+belowDays.length+' day'+(belowDays.length!==1?'s':'')+' below minimum'+(activeDept?' ('+esc(activeDept)+')':'')+'</b><div style="margin-top:4px;font-size:12px;">'+belowDays.join(' &nbsp;·&nbsp; ')+'</div></div></div>';
    }
    var unassigned=0;
    rDates.forEach(function(d){rDeptEmps.forEach(function(emp){if(!getShift(activeDept,emp.id,formatDate(d)))unassigned++;});});
    if(unassigned>0){
      h+='<div class="unassigned-box">&#9888; <b>'+unassigned+' unassigned slots</b> — click any cell to assign ON or OFF</div>';
    }
  }
  root.innerHTML=h;
}

render();
window.addEventListener('resize',render);
</script>
</body>
</html>
